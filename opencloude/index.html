<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вхід / Реєстрація</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="form-box">

        <!-- ВХІД -->
        <section id="loginPage">
            <h1>Вхід</h1>

            <form id="loginForm">
                <div class="input-group">
                    <label for="loginIdentifier">Пошта або телефон</label>
                    <input
                        type="text"
                        id="loginIdentifier"
                        placeholder="Введіть пошту або телефон"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="loginPassword">Пароль</label>
                    <input
                        type="password"
                        id="loginPassword"
                        placeholder="Введіть пароль"
                        required
                    >
                </div>

                <button type="submit" class="main-button">Увійти</button>
            </form>

            <p class="forgot">
                <button type="button" id="forgotButton">
                    Забули пароль?
                </button>
            </p>

            <p class="switch">
                Немає акаунта?
                <button type="button" id="openRegister">
                    Зареєструватися
                </button>
            </p>

            <p class="message" id="loginMessage" aria-live="polite"></p>
        </section>


        <!-- РЕЄСТРАЦІЯ -->
        <section id="registerPage" hidden>
            <h1>Реєстрація</h1>

            <form id="registerForm">
                <div class="input-group">
                    <label for="firstName">Ім'я</label>
                    <input
                        type="text"
                        id="firstName"
                        placeholder="Введіть ім'я"
                        autocomplete="given-name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="lastName">Прізвище</label>
                    <input
                        type="text"
                        id="lastName"
                        placeholder="Введіть прізвище"
                        autocomplete="family-name"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="registerEmail">Електронна пошта</label>
                    <input
                        type="email"
                        id="registerEmail"
                        placeholder="example@gmail.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="registerPhone">Номер телефону</label>
                    <input
                        type="tel"
                        id="registerPhone"
                        placeholder="+380XXXXXXXXX"
                        autocomplete="tel"
                        pattern="[+0-9() -]{10,20}"
                        title="Введіть коректний номер телефону"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="registerPassword">Пароль</label>
                    <input
                        type="password"
                        id="registerPassword"
                        placeholder="Мінімум 8 символів"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="confirmPassword">Повторіть пароль</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Повторіть пароль"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="main-button">
                    Зареєструватися
                </button>
            </form>

            <p class="switch">
                Уже є акаунт?
                <button type="button" id="backToLogin">
                    Увійти
                </button>
            </p>

            <p class="message" id="registerMessage" aria-live="polite"></p>
        </section>


        <!-- ВІДНОВЛЕННЯ ПАРОЛЯ -->
        <section id="forgotPage" hidden>
            <h1>Відновлення пароля</h1>

            <p class="description">
                Введіть пошту або номер телефону, зазначені під час реєстрації.
            </p>

            <form id="recoveryForm">
                <div class="input-group">
                    <label for="recoveryIdentifier">Пошта або телефон</label>
                    <input
                        type="text"
                        id="recoveryIdentifier"
                        placeholder="Введіть пошту або телефон"
                        required
                    >
                </div>

                <button type="submit" class="main-button">
                    Отримати код
                </button>
            </form>

            <p class="message" id="recoveryMessage" aria-live="polite"></p>

            <!-- ПЕРЕВІРКА КОДУ -->
            <form id="verifyForm" hidden>
                <div class="input-group">
                    <label for="verificationCode">Код підтвердження</label>
                    <input
                        type="text"
                        id="verificationCode"
                        placeholder="Введіть 6-значний код"
                        inputmode="numeric"
                        pattern="[0-9]{6}"
                        maxlength="6"
                        autocomplete="one-time-code"
                        required
                    >
                </div>

                <button type="submit" class="main-button">
                    Підтвердити код
                </button>
            </form>

            <!-- НОВИЙ ПАРОЛЬ -->
            <form id="newPasswordForm" hidden>
                <div class="input-group">
                    <label for="newPassword">Новий пароль</label>
                    <input
                        type="password"
                        id="newPassword"
                        placeholder="Мінімум 8 символів"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <div class="input-group">
                    <label for="confirmNewPassword">Повторіть новий пароль</label>
                    <input
                        type="password"
                        id="confirmNewPassword"
                        placeholder="Повторіть пароль"
                        minlength="8"
                        autocomplete="new-password"
                        required
                    >
                </div>

                <button type="submit" class="main-button">
                    Змінити пароль
                </button>
            </form>

            <p class="switch">
                <button type="button" id="backFromRecovery">
                    ← Повернутися до входу
                </button>
            </p>
        </section>

    </div>
</div>

<script src="script.js"></script>
</body>
</html>
